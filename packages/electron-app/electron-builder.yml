appId: com.thuis.app
productName: Thuis
artifactName: "${productName}-${version}-${arch}.${ext}"
directories:
  output: dist
  buildResources: build
files:
  - dist/**/*
  - package.json
extraResources:
  - from: node_modules/@thuis/core/dist
    to: core
win:
  target: [nsis, portable]
mac:
  target: [dmg, zip]
linux:
  target: [AppImage, deb, rpm]
  category: AudioVideo
