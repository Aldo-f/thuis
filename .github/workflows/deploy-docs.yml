name: Deploy Docs

on:
  push:
    branches:
      - main
      - v*/main
    paths:
      - 'website/**'
      - '.github/workflows/deploy-docs.yml'
      - 'pyproject.toml'
      - 'requirements.txt'
      - 'src/**'
      - 'tests/**'
  workflow_dispatch:  # allow manual trigger

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt
        working-directory: .

      - name: Run pytest
        run: python -m pytest
        working-directory: .

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Validate versioned docs directories
        run: |
          for version in $(jq -r '.[]' versions.json); do
            dir="versioned_docs/version-${version}"
            if [ ! -d "$dir" ]; then
              echo "❌ Missing versioned docs directory: $dir"
              exit 1
            fi
            echo "✓ Found: $dir"
          done
          echo "All versions validated successfully."

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/build
  deploy:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
